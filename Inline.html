<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Element</title>
</head>
<body>
    <h3>This is an Inline-Level Element</h3>
    <p>This is an inline span<span style="border-style: solid;">Hello World</span>! element inside a paragraph.</p>
    <p>The SPAN element is an inline-level element, which does not start on a new line and only takes up as much width as necessary.</p>
</body>
</html>
