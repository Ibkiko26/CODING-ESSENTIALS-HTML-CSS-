<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Element</title>
</head>
<body>
    <h3>This is a Block-Level Element</h3>
    <p style="border-style: solid;">Hello World!</p>
    <div style="border-style: solid;">Hello World!</div>

    <p>A block element is an element that starts on a new line and takes up the full width of its container.</p>
</body>
</html>
