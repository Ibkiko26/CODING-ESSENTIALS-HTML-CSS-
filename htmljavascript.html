<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HTML JavaScript</title>
    </head>
    <body>
        <h1>My First JavaScript</h1>

        <img id="bulb" src="Images/picture__bulb_off.jpg" width="100" height="170" alt="Bulb off">

        <script>
          function light(isOn) {
            document.getElementById("bulb").src = isOn
              ? "Images/picture_bulb_on.png"
              : "Images/picture__bulb_off.jpg";
            document.getElementById("bulb").alt = isOn ? "Bulb on" : "Bulb off";
          }
        </script>

        <button type="button" onclick="light(true)">Turn On</button>
        <button type="button" onclick="light(false)">Turn Off</button>
        
</body>
</html>
