<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id Attribute</title>
    <link rel="stylesheet" href="id.css">
</head>
<body>
    <h3>The Id Attribute</h3>
    <p>use CSS to style the element with the id "myHeader"</p>

    <!-- An element with a unique id attribute -->
    <h1 id="myHeader">My Header</h1>

    <!-- Multiple elements with same class -->
    <h2 class="city">London</h2>
    <p>London is the capital of England and the United Kingdom.</p>

    <h2 class="city">Paris</h2>
    <p>Paris is the capital of France.</p>

    <h2 class="city">New York</h2>
    <p>New York City is the largest city in the United States.</p>
    
</body>
</html>
