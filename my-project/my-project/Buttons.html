<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
    <head>
        <title>Buttons Page</title>
    </head>
    <style>
        a;link, a:visited {
            background-color: lightblue;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            color: blue;
            text-decoration: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        a;hover, a:active {
            background-color: red;
        }
    </style>
    <body>
        <h3>Buttons</h3>
        <hr>
        <br>
        <a href="Table.html"><button type="button" style="background-color:lightblue;border:2px solid black;border-radius:10px;">Go to Table</button></a>
        <button type="button" onclick="alert('You clicked the button!')"style="background-color:lightblue;border:2px solid black;border-radius:10px;">Click Me</button>
        <button type="submit" target="_blank">Submit</button>
        <button type="reset" target="_blank">Reset</button>
        <button type="button" disabled>Disabled Button</button>
    </body>
</html>
