<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Non-Script Page</title>
</head>
<body>
    <h3>Non-Script Page</h3>
    <hr>
    <p id="demo"></p>
    <script>
        document.getElementById("demo").innerHTML = "Hello JavaScript!";
    </script>
    <nonscript>
        <p>Sorry, your browser does not support JavaScript or it is disabled.</p>
    </nonscript>
</body>
</html>
