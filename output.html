<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Element</title>
</head>
<body>
    <h2>The Output Element</h2>
    <p>The output element is used to display the result of a calculation or user action.</p>
    <form action="/action_page.php" oninput="result.value=parseInt(a.value)+parseInt(b.value)">
        <label for="a">Enter a number:</label>
        0
        <input type="range" id="a" name="a" value="50">
        100 +
        <input type="number" id="b" name="b" value="50">
        <br><br>
        <input type="submit" value="Calculate" for="a b">
    </form>
</body>
</html>
